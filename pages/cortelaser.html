<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomas Aéreas — Video Grabaciones Gorilaz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <style>
    .page-hero {
      min-height: 40vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: calc(var(--nav-h) + 3rem) 2rem 3.5rem;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(201,168,76,0.1) 0%, transparent 65%),
        linear-gradient(180deg, #0A0A0A 0%, #111 100%);
      position: relative;
      overflow: hidden;
    }
    .page-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23C9A84C' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='1'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }
    .page-hero-content { position: relative; z-index: 1; }
    .page-eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }
    .page-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    .page-desc {
      font-size: 0.95rem;
      color: var(--gray-2);
      font-weight: 300;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.7;
    }
    .page-gold-line {
      width: 50px;
      height: 2px;
      background: var(--gold);
      margin: 1.2rem auto 0;
    }

    /* ===== GALERIA ===== */
    .galeria-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 5rem 2rem 6rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gray-3);
      margin-bottom: 3rem;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--gold); }
    .back-arrow { transition: transform var(--transition); }
    .back-link:hover .back-arrow { transform: translateX(-4px); }

    .galeria-meta {
      margin-bottom: 2.5rem;
    }
    .galeria-count {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray-4);
    }
    .galeria-count span {
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 1rem;
      margin-right: 6px;
    }

    /* Grid principal — 2 columnas para videos horizontales */
    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.6rem;
    }

    /* ---- Tarjeta Facebook ---- */
    .aerea-card {
      background: var(--dark-2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
      position: relative;
    }
    .aerea-card:hover {
      transform: translateY(-5px);
      border-color: rgba(201,168,76,0.35);
      box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 20px rgba(201,168,76,0.07);
    }

    /* Thumbnail placeholder con ícono dron */
    .aerea-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #161616, #222);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .aerea-thumb::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.06), transparent 70%);
    }
    .drone-icon {
      font-size: 3.5rem;
      color: rgba(201,168,76,0.25);
      position: relative;
      z-index: 1;
      transition: transform 0.4s ease, color 0.3s ease;
    }
    .aerea-card:hover .drone-icon {
      transform: translateY(-6px) scale(1.1);
      color: rgba(201,168,76,0.45);
    }

    .aerea-card-body {
      padding: 1.2rem 1.5rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .aerea-label {
      font-family: var(--font-display);
      font-size: 0.95rem;
      color: var(--white);
      letter-spacing: 0.06em;
    }
    .aerea-sub {
      font-size: 0.72rem;
      color: var(--gray-4);
      margin-top: 3px;
      letter-spacing: 0.05em;
    }
    .btn-fb {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0.65rem 1.2rem;
      background: transparent;
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: var(--radius-sm);
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: background var(--transition), border-color var(--transition), transform var(--transition);
      flex-shrink: 0;
    }
    .btn-fb:hover {
      background: rgba(201,168,76,0.1);
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    /* ---- Tarjeta local (video/foto) ---- */
    /* Los videos/fotos locales son horizontales, se muestran directo */
    .aerea-card-local .aerea-media {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      display: block;
      position: relative;
    }
    .aerea-card-local video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .aerea-card-local img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }
    .aerea-card-local .aerea-card-body {
      padding: 0.9rem 1.2rem 1rem;
    }
    .local-badge {
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
      background: rgba(201,168,76,0.1);
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.25);
      flex-shrink: 0;
    }

    @media (max-width: 700px) {
      .galeria-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">GORILAZ</span>
      </a>
      <ul class="nav-links">
        <li><a href="../index.html#servicios">Servicios</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="ubicacion.html">Ubicación</a></li>
      </ul>
      <button class="hamburger" id="hamburger" aria-label="Menú">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- HERO -->
  <header class="page-hero">
    <div class="page-hero-content">
      <p class="page-eyebrow"></p>
      <h1 class="page-title">Corte y Grabado Laser</h1>
      <p class="page-desc"></p>
      <div class="page-gold-line"></div>
    </div>
  </header>

  <!-- GALERÍA -->
  <section class="galeria-section">

    <a href="../index.html" class="back-link reveal">
      <span class="back-arrow">←</span> Volver al inicio
    </a>

    <div class="galeria-meta reveal">
      <p class="galeria-count"><span>1</span> tomas disponibles</p>
    </div>

    <div class="galeria-grid">

      <!-- VIDEO LOCAL 1 — coloca el archivo en videos/aereas/aerea-1.mp4 -->
      <div class="aerea-card aerea-card-local reveal reveal-delay-1">
        <div class="aerea-media">
          <video controls preload="metadata">
            <source src="../videos/cortelaser/corte1.mp4" type="video/mp4" />
          </video>
        </div>
        <div class="aerea-card-body">
          <div>
            <p class="aerea-label">Toma 1</p>
            <p class="aerea-sub">Video</p>
          </div>
          <span class="local-badge">HD</span>
        </div>
      </div>

      
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">GORILAZ</span>
      </div>
      <p class="footer-tagline">Video Grabaciones Gorilaz — Contepec, Michoacán</p>
      <div class="footer-links">
        <a href="contacto.html">Contacto</a>
        <span>·</span>
        <a href="ubicacion.html">Ubicación</a>
      </div>
      <p class="footer-copy">&copy; 2025 Video Grabaciones Gorilaz. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
